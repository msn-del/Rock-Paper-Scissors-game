<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="inter.js"></script>

  </head>
  <body onload="updateScoreDisplay()">
    <p>Rock Paper Scissors</p>
    <button onclick="
      playGame('rock');
    ">Rock</button>

    <button onclick="
      playGame('paper');
    ">Paper</button>

    <button onclick="
      playGame('scissors');
    ">Scissors</button>
    <button onclick="
        restscore();
    ">reset score</button>
    <div id="game"></div>
    <div id="result"></div>
     <div id="score-display"></div>

  </body>
</html>
